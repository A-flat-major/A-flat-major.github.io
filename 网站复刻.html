<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站复刻-上海对外经贸大学</title>
    <link rel="stylesheet" href="网站复刻.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav">
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">学校概况</a></li>
            <li><a href="#">院系设置</a></li>
            <li><a href="#">招生就业</a></li>
            <li><a href="#">国际交流</a></li>
        </ul>
    </div>

    <!-- 横向滚动图 -->
    <div class="banner-container">
        <div class="color-block"></div>
    </div>
    
    <!-- 布局1：左侧一半 + 右侧平分 -->
    <div class="layout-1">
        <div class="container">
            <div class="left"></div>
            <div class="right">
                <div class="block"></div>
                <div class="block"></div>
            </div>
        </div>
    </div>

    <!-- 布局2：右50% + 左分左右 -->
    <div class="layout-2">
        <div class="container">
            <div class="left">
                <div class="block"></div>
                <div class="block"></div>
            </div>
            <div class="right"></div>
        </div>
    </div>

    <!-- 布局3：左右平分 -->
    <div class="layout-3">
        <div class="container">
            <div class="half"></div>
            <div class="half"></div>
        </div>
    </div>

    <!-- 布局4：三等分 -->
    <div class="layout-4">
        <div class="container">
            <div class="trisection"></div>
            <div class="trisection"></div>
            <div class="trisection"></div>
        </div>
    </div>

    <footer class="footer">
        <p>版权所有 © 上海对外经贸大学</p>
    </footer>
</body>
</html>
